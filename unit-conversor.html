<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Conversor</title>
    <link rel="stylesheet" href="unit-conversor.css" />
    <script src="unit-conversor.js" defer></script>
  </head>
  <body>
    <main>
      <div class="header">
        <h1>Unit Conversor</h1>
        <div class="cambio-pestaña">
          <button class="km-mph" id="km-mph">KM -> Millas</button>
          <button class="c-f" id="c-f">C⁰ -> F</button>
          <button class="kg-lb" id="kg-lb">Kg -> lb</button>
        </div>
      </div>
      <section class="km-millas" id="km-millas">
        <div class="container">
          <div class="input-container">
            <input
              type="text"
              placeholder="Enter Km"
              name="input-km"
              id="input-km"
            />
            <label for="input-km">Km</label>
          </div>
          <div class="respuesta">
            <div class="respuesta-km"></div>
          </div>
        </div>
      </section>
      <section class="cToF" id="cToF">
        <div class="container">
          <div class="input-container">
            <input
              type="text"
              placeholder="Enter C⁰"
              name="input-C⁰"
              id="input-c"
            />
            <label for="input-C⁰">C⁰</label>
          </div>
          <div class="respuesta">
            <div class="respuesta-c"></div>
          </div>
        </div>
      </section>
      <section class="kgToLb" id="kgToLb">
        <div class="container">
          <div class="input-container">
            <input
              type="text"
              placeholder="Enter KG"
              name="input-KG"
              id="input-kg"
            />
            <label for="input-KG">KG</label>
          </div>
          <div class="respuesta">
            <div class="respuesta-kg"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
